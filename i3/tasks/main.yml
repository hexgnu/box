---
- name: install i3 window manager and dependencies
  dnf:
    name:
      - i3
      - i3status
      - i3lock
      - picom
      - rofi
      - feh
      - xbacklight
      - dunst
      - arandr
      - xorg-x11-server-Xorg
      - xorg-x11-xinit-session
    state: present
  tags: [packages, desktop, i3, quick]

- name: update i3 window manager and dependencies to latest
  dnf:
    name:
      - i3
      - i3status
      - i3lock
      - picom
      - rofi
      - feh
      - xbacklight
      - dunst
      - arandr
      - xorg-x11-server-Xorg
      - xorg-x11-xinit-session
    state: latest
  tags: [update, desktop]


