---
# Developer Tools Installation Role

# GitHub CLI
- name: Install GitHub CLI
  dnf:
    name: gh
    state: latest

# Azure CLI
- name: Import Microsoft GPG key
  rpm_key:
    state: present
    key: https://packages.microsoft.com/keys/microsoft.asc

- name: Add Azure CLI repository
  yum_repository:
    name: azure-cli
    description: Azure CLI
    baseurl: https://packages.microsoft.com/yumrepos/azure-cli
    enabled: yes
    gpgcheck: yes
    gpgkey: https://packages.microsoft.com/keys/microsoft.asc

- name: Install Azure CLI
  dnf:
    name: azure-cli
    state: latest

# Google Cloud SDK
- name: Add Google Cloud SDK repository
  yum_repository:
    name: google-cloud-sdk
    description: Google Cloud SDK
    baseurl: https://packages.cloud.google.com/yum/repos/cloud-sdk-el9-x86_64
    enabled: yes
    gpgcheck: yes
    repo_gpgcheck: no
    gpgkey:
      - https://packages.cloud.google.com/yum/doc/yum-key.gpg
      - https://packages.cloud.google.com/yum/doc/rpm-package-key.gpg

- name: Install Google Cloud CLI
  dnf:
    name: google-cloud-cli
    state: latest

# Rust and Cargo
- name: Install Rust and Cargo
  dnf:
    name:
      - rust
      - cargo
      - rust-src
      - rust-std-static
      - rust-analyzer
    state: latest

# Development Tools from standard repos
- name: Install development tools from repos
  dnf:
    name:
      - GraphicsMagick
      - GraphicsMagick-devel
      - httpie
      - gnome-screenshot
    state: latest

# Modern CLI Tools (2026 standard development environment)
# Install tools available in standard Fedora repos
- name: Install modern CLI tools from standard repos
  dnf:
    name:
      - fzf            # Fuzzy finder
      - zoxide         # Smart directory jumper
      - bat            # Better cat with syntax highlighting
      - fd-find        # Fast find alternative
      - btop           # Modern system monitor
      - ripgrep        # Fast grep alternative
      - gh             # GitHub CLI (already installed above, included for completeness)
      - jq             # JSON processor
      - git-delta      # Beautiful git diffs with syntax highlighting
      - tealdeer       # Simplified man pages (tldr Rust implementation)
      - yq             # YAML processor (like jq for YAML)
    state: latest
  tags: [cli-tools, modern-tools]

# Enable COPR repositories for tools not in standard repos
# Note: COPR repos may not have Fedora 42 builds yet - ignore errors
- name: Enable COPR repo for eza
  command: dnf copr enable -y atim/eza
  args:
    creates: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:atim:eza.repo
  ignore_errors: true
  register: eza_copr
  tags: [cli-tools, modern-tools, copr]

- name: Enable COPR repo for lazygit
  command: dnf copr enable -y atim/lazygit
  args:
    creates: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:atim:lazygit.repo
  ignore_errors: true
  register: lazygit_copr
  tags: [cli-tools, modern-tools, copr]

# Install tools from COPR repos (if repos were enabled successfully)
- name: Install lazygit from COPR
  dnf:
    name: lazygit
    state: latest
  when: lazygit_copr is succeeded
  ignore_errors: true
  tags: [cli-tools, modern-tools, copr]

- name: Install eza from COPR
  dnf:
    name: eza
    state: latest
  when: eza_copr is succeeded
  ignore_errors: true
  tags: [cli-tools, modern-tools, copr]

# Fallback: Install eza from GitHub releases if COPR failed
- name: Check if eza is installed
  command: which eza
  register: eza_check
  changed_when: false
  failed_when: false
  tags: [cli-tools, modern-tools]

- name: Install eza from GitHub releases (fallback)
  block:
    - name: Download latest eza release
      get_url:
        url: https://github.com/eza-community/eza/releases/latest/download/eza_x86_64-unknown-linux-gnu.tar.gz
        dest: /tmp/eza.tar.gz
        mode: '0644'

    - name: Extract eza binary
      unarchive:
        src: /tmp/eza.tar.gz
        dest: /usr/local/bin/
        remote_src: yes
        mode: '0755'

    - name: Clean up eza download
      file:
        path: /tmp/eza.tar.gz
        state: absent
  when: eza_check.rc != 0
  ignore_errors: true
  tags: [cli-tools, modern-tools, github]

# Verify Modern CLI Tools Installation
- name: Verify modern CLI tools are available
  command: "which {{ item }}"
  register: tool_check
  changed_when: false
  failed_when: false
  loop:
    - fzf
    - zoxide
    - eza
    - bat
    - fd
    - delta
    - lazygit
    - btop
    - tldr      # Note: binary is 'tldr' via tealdeer package
    - rg
    - jq
    - yq
  tags: [cli-tools, modern-tools, verify]

- name: Report missing tools
  debug:
    msg: "WARNING: {{ item.item }} is not available in PATH"
  when: item.rc != 0
  loop: "{{ tool_check.results }}"
  tags: [cli-tools, modern-tools, verify]

# Note: eza and lazygit are now installed via COPR repos (see tasks above)
# The COPR repos are: atim/eza and atim/lazygit

# Hadolint - Docker/Containerfile linter
- name: Check if hadolint is installed
  stat:
    path: /usr/local/bin/hadolint
  register: hadolint_installed

- name: Download hadolint binary
  get_url:
    url: https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
    dest: /usr/local/bin/hadolint
    mode: '0755'
  when: not hadolint_installed.stat.exists
