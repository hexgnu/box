---
# Developer Tools Installation Role

# GitHub CLI
- name: Install GitHub CLI
  dnf:
    name: gh
    state: latest

# Azure CLI
- name: Import Microsoft GPG key
  rpm_key:
    state: present
    key: https://packages.microsoft.com/keys/microsoft.asc

- name: Add Azure CLI repository
  yum_repository:
    name: azure-cli
    description: Azure CLI
    baseurl: https://packages.microsoft.com/yumrepos/azure-cli
    enabled: yes
    gpgcheck: yes
    gpgkey: https://packages.microsoft.com/keys/microsoft.asc

- name: Install Azure CLI
  dnf:
    name: azure-cli
    state: latest

# Google Cloud SDK
- name: Add Google Cloud SDK repository
  yum_repository:
    name: google-cloud-sdk
    description: Google Cloud SDK
    baseurl: https://packages.cloud.google.com/yum/repos/cloud-sdk-el9-x86_64
    enabled: yes
    gpgcheck: yes
    repo_gpgcheck: no
    gpgkey:
      - https://packages.cloud.google.com/yum/doc/yum-key.gpg
      - https://packages.cloud.google.com/yum/doc/rpm-package-key.gpg

- name: Install Google Cloud CLI
  dnf:
    name: google-cloud-cli
    state: latest

# Rust and Cargo
- name: Install Rust and Cargo
  dnf:
    name:
      - rust
      - cargo
      - rust-src
      - rust-std-static
      - rust-analyzer
    state: latest

# Development Tools from standard repos
- name: Install development tools from repos
  dnf:
    name:
      - GraphicsMagick
      - GraphicsMagick-devel
      - httpie
      - gnome-screenshot
    state: latest

# Modern CLI Tools (2026 standard development environment)
# Install tools available in standard Fedora repos
- name: Install modern CLI tools from standard repos
  dnf:
    name:
      - fzf            # Fuzzy finder
      - zoxide         # Smart directory jumper
      - bat            # Better cat with syntax highlighting
      - fd-find        # Fast find alternative
      - btop           # Modern system monitor
      - ripgrep        # Fast grep alternative
      - gh             # GitHub CLI (already installed above, included for completeness)
      - jq             # JSON processor
    state: latest
  tags: [cli-tools, modern-tools]

# Install tools that may require COPR or alternative repos
# Note: These packages may not be in standard repos and might fail
- name: Install modern CLI tools from extended repos
  dnf:
    name:
      - eza            # Modern ls replacement (may need COPR)
      - git-delta      # Beautiful git diffs (may need COPR)
      - lazygit        # Git terminal UI (may need COPR)
      - tldr           # Simplified man pages (may need COPR or tealdeer)
      - yq             # YAML processor
    state: latest
  ignore_errors: true
  tags: [cli-tools, modern-tools]

# Verify Modern CLI Tools Installation
- name: Verify modern CLI tools are available
  command: "which {{ item }}"
  register: tool_check
  changed_when: false
  failed_when: false
  loop:
    - fzf
    - zoxide
    - eza
    - bat
    - fd
    - delta
    - lazygit
    - btop
    - tldr
    - rg
    - jq
    - yq
  tags: [cli-tools, modern-tools, verify]

- name: Report missing tools
  debug:
    msg: "WARNING: {{ item.item }} is not available in PATH"
  when: item.rc != 0
  loop: "{{ tool_check.results }}"
  tags: [cli-tools, modern-tools, verify]

# Manual installation for eza (not in Fedora 42 standard repos)
# The rust-eza package was orphaned by its maintainer
- name: Check if eza is installed
  command: which eza
  register: eza_installed
  changed_when: false
  failed_when: false
  tags: [cli-tools, modern-tools, manual]

- name: Display eza installation instructions if missing
  debug:
    msg: |
      eza is not installed. To install manually:
      1. Download from: https://github.com/eza-community/eza/releases/latest
      2. Extract and copy to /usr/local/bin/eza
      3. Or use cargo: cargo install eza
      4. Or enable COPR: sudo dnf copr enable atim/eza && sudo dnf install eza
  when: eza_installed.rc != 0
  tags: [cli-tools, modern-tools, manual]

# Hadolint - Docker/Containerfile linter
- name: Check if hadolint is installed
  stat:
    path: /usr/local/bin/hadolint
  register: hadolint_installed

- name: Download hadolint binary
  get_url:
    url: https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
    dest: /usr/local/bin/hadolint
    mode: '0755'
  when: not hadolint_installed.stat.exists
