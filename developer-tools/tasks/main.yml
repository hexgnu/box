---
# Developer Tools Installation Role

# GitHub CLI
- name: Install GitHub CLI
  dnf:
    name: gh
    state: present
  tags: [packages, dev-tools, quick]

# Azure CLI
- name: Import Microsoft GPG key
  rpm_key:
    state: present
    key: https://packages.microsoft.com/keys/microsoft.asc

- name: Add Azure CLI repository
  yum_repository:
    name: azure-cli
    description: Azure CLI
    baseurl: https://packages.microsoft.com/yumrepos/azure-cli
    enabled: yes
    gpgcheck: yes
    gpgkey: https://packages.microsoft.com/keys/microsoft.asc

- name: Install Azure CLI
  dnf:
    name: azure-cli
    state: present
  tags: [packages, dev-tools, quick]

# Google Cloud SDK
- name: Add Google Cloud SDK repository
  yum_repository:
    name: google-cloud-sdk
    description: Google Cloud SDK
    baseurl: https://packages.cloud.google.com/yum/repos/cloud-sdk-el9-x86_64
    enabled: yes
    gpgcheck: yes
    repo_gpgcheck: no
    gpgkey:
      - https://packages.cloud.google.com/yum/doc/yum-key.gpg
      - https://packages.cloud.google.com/yum/doc/rpm-package-key.gpg

- name: Install Google Cloud CLI
  dnf:
    name: google-cloud-cli
    state: present
  tags: [packages, dev-tools, quick]

# Rust and Cargo
- name: Install Rust and Cargo
  dnf:
    name:
      - rust
      - cargo
      - rust-src
      - rust-std-static
      - rust-analyzer
    state: present
  tags: [packages, dev-tools, quick]

# Development Tools from standard repos
- name: Install development tools from repos
  dnf:
    name:
      - GraphicsMagick
      - GraphicsMagick-devel
      - httpie
      - gnome-screenshot
    state: present
  tags: [packages, dev-tools, quick]

# Modern CLI Tools (2026 standard development environment)
# Install tools available in standard Fedora repos
- name: Install modern CLI tools from standard repos
  dnf:
    name:
      - fzf            # Fuzzy finder
      - zoxide         # Smart directory jumper
      - bat            # Better cat with syntax highlighting
      - fd-find        # Fast find alternative
      - btop           # Modern system monitor
      - ripgrep        # Fast grep alternative
      - gh             # GitHub CLI (already installed above, included for completeness)
      - jq             # JSON processor
      - git-delta      # Beautiful git diffs with syntax highlighting
      - tealdeer       # Simplified man pages (tldr Rust implementation)
      - yq             # YAML processor (like jq for YAML)
    state: present
  tags: [cli-tools, modern-tools]

# COPR repositories don't support Fedora 42 yet - install from GitHub releases instead
# - name: Enable COPR repo for eza (disabled - no Fedora 42 support)
# - name: Enable COPR repo for lazygit (disabled - no Fedora 42 support)

# Install eza from GitHub releases (COPR not available for Fedora 42)
- name: Check if eza is installed
  command: which eza
  register: eza_check
  changed_when: false
  failed_when: false
  tags: [cli-tools, modern-tools]

- name: Install eza from GitHub releases
  block:
    - name: Download latest eza release
      get_url:
        url: https://github.com/eza-community/eza/releases/latest/download/eza_x86_64-unknown-linux-gnu.tar.gz
        dest: /tmp/eza.tar.gz
        mode: '0644'

    - name: Extract eza binary
      unarchive:
        src: /tmp/eza.tar.gz
        dest: /usr/local/bin/
        remote_src: yes
        mode: '0755'

    - name: Clean up eza download
      file:
        path: /tmp/eza.tar.gz
        state: absent
  when: eza_check.rc != 0
  tags: [cli-tools, modern-tools, github]

# Install lazygit from GitHub releases (COPR not available for Fedora 42)
- name: Check if lazygit is installed
  command: which lazygit
  register: lazygit_check
  changed_when: false
  failed_when: false
  tags: [cli-tools, modern-tools]

- name: Install lazygit from GitHub releases
  block:
    - name: Get latest lazygit version
      uri:
        url: https://api.github.com/repos/jesseduffield/lazygit/releases/latest
        return_content: yes
      register: lazygit_release

    - name: Download latest lazygit release
      get_url:
        url: "https://github.com/jesseduffield/lazygit/releases/latest/download/lazygit_{{ lazygit_release.json.tag_name | regex_replace('^v', '') }}_Linux_x86_64.tar.gz"
        dest: /tmp/lazygit.tar.gz
        mode: '0644'

    - name: Extract lazygit binary
      unarchive:
        src: /tmp/lazygit.tar.gz
        dest: /usr/local/bin/
        remote_src: yes
        mode: '0755'
        include:
          - lazygit

    - name: Clean up lazygit download
      file:
        path: /tmp/lazygit.tar.gz
        state: absent
  when: lazygit_check.rc != 0
  tags: [cli-tools, modern-tools, github]

# Verify Modern CLI Tools Installation
- name: Verify modern CLI tools are available
  command: "which {{ item }}"
  register: tool_check
  changed_when: false
  failed_when: false
  loop:
    - fzf
    - zoxide
    - eza
    - bat
    - fd
    - delta
    - lazygit
    - btop
    - tldr      # Note: binary is 'tldr' via tealdeer package
    - rg
    - jq
    - yq
  tags: [cli-tools, modern-tools, verify]

- name: Report missing tools
  debug:
    msg: "WARNING: {{ item.item }} is not available in PATH"
  when: item.rc != 0
  loop: "{{ tool_check.results }}"
  tags: [cli-tools, modern-tools, verify]

# Note: eza and lazygit are now installed via COPR repos (see tasks above)
# The COPR repos are: atim/eza and atim/lazygit

# Hadolint - Docker/Containerfile linter
- name: Check if hadolint is installed
  stat:
    path: /usr/local/bin/hadolint
  register: hadolint_installed
  tags: [dev-tools, quick]

- name: Download hadolint binary
  get_url:
    url: https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
    dest: /usr/local/bin/hadolint
    mode: '0755'
  when: not hadolint_installed.stat.exists
  tags: [dev-tools]

# Update task - run with --tags update to upgrade all dev tools to latest
- name: Update all developer tools to latest versions
  dnf:
    name:
      - gh
      - azure-cli
      - google-cloud-cli
      - rust
      - cargo
      - rust-src
      - rust-std-static
      - rust-analyzer
      - GraphicsMagick
      - GraphicsMagick-devel
      - httpie
      - gnome-screenshot
      - fzf
      - zoxide
      - bat
      - fd-find
      - btop
      - ripgrep
      - jq
      - git-delta
      - tealdeer
      - yq
    state: latest
  tags: [update, dev-tools-update]
