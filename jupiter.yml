---
# Jupiter System Configuration
# Ansible playbook for Fedora Linux workstation provisioning
# Hostname: jupiter.home

- hosts: all
  user: root
  gather_facts: no
  vars:
    username: hexgnu
    hostname: jupiter.home
    email: matt@matthewkirk.com
    ansible_python_interpreter: /usr/bin/python3
    ssh_keygen_bits: 4096
    ssh_keygen_types:
      - ed25519
    fedora_version: 42
  
  roles:
    - setup
    - keys
    # Dotfiles role is available but NOT run automatically (tagged 'manual').
    # Run manually after provisioning: cd ~/git/personal/dotfiles && ./bin/dotfiles
    # Or run with: ansible-playbook -K -i hosts jupiter.yml --tags dotfiles
    - role: dotfiles
      tags: [dotfiles, manual, never]
    - i3
    - i3blocks
    - flatpak
    - brave
    - st
    - vim
    - pyenv
    - nvm
    - podman
    - developer-tools
    - direnv
    - slack
    - zoom
    - wavebox    # Unified communications (Teams x2, Slack, Email, Zoom)
    - 1password  # 1Password CLI for password management
    - nvidia
    # - wireguard  # VPN server - DISABLED (needs configuration, failing to start)
    - ddns       # Dynamic DNS for jupiter.modulus7.com
  become_method: sudo
  become: true
  
  tasks:
    - hostname:
        name: jupiter.home

    # Someday revisit to implement better security for this.
    - service:
        name: sshd
        state: started

    - name: Install RPMFusion free
      tags: [personal, quick]
      dnf:
        name: "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ fedora_version }}.noarch.rpm"
        disable_gpg_check: yes
        state: present

    - name: Install RPMFusion non free
      tags: [personal, quick]
      dnf:
        disable_gpg_check: yes
        name: "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ fedora_version }}.noarch.rpm"
        state: present

    # System-wide update task - runs with --tags update
    - name: System-Wide DNF Upgrade (updates ALL packages to latest)
      dnf:
        name: "*"
        state: latest
        update_cache: yes
      tags: [update, system-update]
      register: dnf_upgrade_result

    - name: Display packages upgraded
      debug:
        msg: "System upgrade complete. {{ dnf_upgrade_result.results | length }} packages processed."
      when: dnf_upgrade_result is defined
      tags: [update, system-update]

  post_tasks:
    - name: System configuration complete
      debug:
        msg: "System {{ hostname }} configured successfully"
      delegate_to: localhost
      run_once: true
      tags: always
