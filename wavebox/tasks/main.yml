---
# Wavebox installation - Unified communication platform
# Recommended for multi-account Teams, Slack, email consolidation
# Research: ../dotfiles/research/unified-comms-evaluation.md

- name: Import Wavebox GPG key
  rpm_key:
    state: present
    key: https://download.wavebox.app/static/wavebox_repo.key
  become: yes
  tags: [wavebox]

- name: Add Wavebox RPM repository
  get_url:
    url: https://download.wavebox.app/stable/linux/rpm/wavebox.repo
    dest: /etc/yum.repos.d/wavebox.repo
    mode: '0644'
  become: yes
  tags: [wavebox]

- name: Install Wavebox via DNF
  dnf:
    name: Wavebox
    state: present
  become: yes
  tags: [wavebox]

- name: Display Wavebox installation instructions
  debug:
    msg: |
      ✅ Wavebox installed successfully via RPM repository!

      Launch: wavebox (or search "Wavebox" in application menu)
      Desktop: Wavebox application should appear in rofi ($mod+d)

      i3 Integration: Already configured in dotfiles/i3/config
        assign [class="Wavebox"] $ws2
        Press $mod+2 to access your unified comms workspace

      Setup Guide:
      1. Launch Wavebox (7-day Pro trial starts automatically)
      2. Create Spaces for cookie isolation:
         - Space 1: OneVizion (Teams + Outlook + Zoom)
         - Space 2: OnPoint (Teams + Outlook)
         - Space 3: Personal (Slack + Proton Mail)
      3. Each Space has isolated cookies (no Teams logout/login!)
      4. Both Teams accounts stay logged in simultaneously

      Full setup guide: ~/git/personal/dotfiles/research/unified-comms-evaluation.md

      Updates: Wavebox will auto-update via DNF when you run:
        sudo dnf upgrade
  tags: [wavebox]
