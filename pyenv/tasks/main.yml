---
# Pyenv installation for Python version management

- name: Install pyenv dependencies
  dnf:
    state: present
    name:
      - make
      - gcc
      - gcc-c++
      - zlib-devel
      - bzip2
      - bzip2-devel
      - readline-devel
      - sqlite
      - sqlite-devel
      - openssl-devel
      - tk-devel
      - libffi-devel
      - xz-devel
      - python3-tkinter
      - findutils
      - git
      - tk-devel
  tags: [packages, dev-tools, quick]

- name: Update pyenv dependencies to latest
  dnf:
    state: latest
    name:
      - make
      - gcc
      - gcc-c++
      - zlib-devel
      - bzip2
      - bzip2-devel
      - readline-devel
      - sqlite
      - sqlite-devel
      - openssl-devel
      - tk-devel
      - libffi-devel
      - xz-devel
      - python3-tkinter
      - findutils
      - git
      - tk-devel
  tags: [update]

- name: Clone pyenv repository for user
  become: yes
  become_user: "{{ username }}"
  git:
    repo: https://github.com/pyenv/pyenv.git
    dest: "/home/{{ username }}/.pyenv"
    update: false
  tags: [dev-tools, quick]

- name: Clone pyenv-virtualenv plugin
  become: yes
  become_user: "{{ username }}"
  git:
    repo: https://github.com/pyenv/pyenv-virtualenv.git
    dest: "/home/{{ username }}/.pyenv/plugins/pyenv-virtualenv"
    update: false
  tags: [dev-tools, quick]

- name: Clone pyenv-update plugin
  become: yes
  become_user: "{{ username }}"
  git:
    repo: https://github.com/pyenv/pyenv-update.git
    dest: "/home/{{ username }}/.pyenv/plugins/pyenv-update"
    update: false
  tags: [dev-tools, quick]

# Pyenv configuration (shell integration, lazy-loading, etc.) is managed by dotfiles repo.
# This role only installs pyenv and its plugins. Users install Python versions manually
# after dotfiles are configured.
#
# Manual steps (run after dotfiles installation):
#   pyenv install 3.12
#   pyenv global 3.12
#
# Note: Python version installation tasks were removed to prevent chicken-and-egg
# dependency where these tasks require bashrc to be configured with pyenv, but
# bashrc configuration is handled by dotfiles repo which runs separately.
