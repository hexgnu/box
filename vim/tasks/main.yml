---
- name: install ctrl-p
  become: true
  become_user: hexgnu
  git:
    update: false
    repo: https://github.com/ctrlpvim/ctrlp.vim.git
    dest: /home/hexgnu/.config/nvim/bundle/ctrlp.vim
  retries: 3
  delay: 5
  register: ctrlp_result
  until: ctrlp_result is succeeded
  tags: [dev-tools, quick]

- name: install packer
  become: true
  become_user: hexgnu
  git:
    update: false
    repo: https://github.com/wbthomason/packer.nvim.git
    dest: /home/hexgnu/.local/share/nvim/site/pack/packer/start/packer.nvim
  retries: 3
  delay: 5
  register: packer_result
  until: packer_result is succeeded
  tags: [dev-tools, quick]

- name: install neovim
  dnf:
    state: present
    name:
      - neovim
  tags: [packages, dev-tools, quick]

- name: update neovim to latest
  dnf:
    state: latest
    name:
      - neovim
  tags: [update]
