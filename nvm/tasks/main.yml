---
# NVM (Node Version Manager) installation and Claude Code setup

- name: Install nvm dependencies
  dnf:
    state: present
    name:
      - curl
      - git
      - make
      - gcc
      - gcc-c++
  tags: [packages, dev-tools, quick]

- name: Update nvm dependencies to latest
  dnf:
    state: latest
    name:
      - curl
      - git
      - make
      - gcc
      - gcc-c++
  tags: [update]

- name: Download and install nvm
  become: yes
  become_user: "{{ username }}"
  shell: |
    curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
  args:
    creates: "/home/{{ username }}/.nvm/nvm.sh"
    executable: /bin/bash
  tags: [dev-tools, quick]

# Note: nvm configuration is now managed in dotfiles repo
# The bashrc setup is handled by the dotfiles symlink

- name: Install Node.js LTS via nvm
  become: yes
  become_user: "{{ username }}"
  shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
    nvm install --lts
    nvm use --lts
    nvm alias default lts/*
  args:
    executable: /bin/bash
    creates: "/home/{{ username }}/.nvm/versions/node"
  tags: [dev-tools, quick]

- name: Check if @anthropic-ai/claude-code is installed
  become: yes
  become_user: "{{ username }}"
  shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
    npm list -g @anthropic-ai/claude-code 2>/dev/null
  args:
    executable: /bin/bash
  register: claude_check
  changed_when: false
  failed_when: false
  tags: [dev-tools, quick]

- name: Install @anthropic-ai/claude-code globally
  become: yes
  become_user: "{{ username }}"
  shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
    npm config set prefix "$HOME/.nvm/versions/node/$(node --version)"
    npm install -g @anthropic-ai/claude-code
  args:
    executable: /bin/bash
  when: claude_check.rc != 0
  register: claude_install
  changed_when: "'added' in claude_install.stdout or 'updated' in claude_install.stdout"
  failed_when: claude_install.rc != 0 and 'EEXIST' not in claude_install.stderr
  tags: [dev-tools, quick]

- name: Check if global npm packages are installed
  become: yes
  become_user: "{{ username }}"
  shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
    npm list -g {{ item }} 2>/dev/null
  args:
    executable: /bin/bash
  loop:
    - typescript
    - ts-node
    - nodemon
    - prettier
    - eslint
    - yarn
    - pnpm
    - pyright
  register: npm_check
  changed_when: false
  failed_when: false
  tags: [dev-tools, quick]

- name: Install other useful global npm packages
  become: yes
  become_user: "{{ username }}"
  shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
    npm config set prefix "$HOME/.nvm/versions/node/$(node --version)"
    npm install -g {{ item.item }}
  args:
    executable: /bin/bash
  loop: "{{ npm_check.results }}"
  when: item.rc != 0
  register: npm_install
  changed_when: "'added' in npm_install.stdout or 'updated' in npm_install.stdout"
  failed_when: npm_install.rc != 0 and 'EEXIST' not in npm_install.stderr
  tags: [dev-tools, quick]

- name: Verify Claude Code installation
  become: yes
  become_user: "{{ username }}"
  shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
    which claude && claude --version
  args:
    executable: /bin/bash
  register: claude_verify
  changed_when: false
  failed_when: false

- name: Display Claude Code installation status
  debug:
    msg: "Claude Code installed: {{ claude_verify.stdout }}"
  when: claude_verify.rc == 0
