---
- name: Check .ssh dir
  file: path=/home/{{ username }}/.ssh state=directory mode=0700 owner={{ username }} group={{ username }}

- name: Create keys
  become: true
  become_user: "{{ username }}"
  command: ssh-keygen -t {{ item }} -b {{ ssh_keygen_bits }} -C "{{ email }}" -N "{{ ssh_keygen_password }}" -f /home/{{ ansible_ssh_user }}/.ssh/id_{{ item }} creates=/home/{{ username }}/.ssh/id_{{ item }} 
  with_items: 
   - "{{ ssh_keygen_types }}"

- name: check private keys cert privileges
  file: 
    path: /home/{{ username }}/.ssh/id_{{ item }}
    owner: "{{username}}" 
    group: "{{username}}"
    mode: 0600
  with_items:
   - "{{ ssh_keygen_types }}"

- name: check public keys cert privileges
  file: 
    path: /home/{{ username }}/.ssh/id_{{ item }}.pub
    owner: "{{username}}" 
    group: "{{username}}"
    mode: 0600
  with_items:
   - "{{ ssh_keygen_types }}"

- name: ensure github.com is a known host
  lineinfile:
    dest: /home/{{username}}/.ssh/known_hosts
    create: yes
    state: present
    line: "{{ lookup('pipe', 'ssh-keyscan -t rsa github.com') }}"
    regexp: "^github\\.com"

- name: Configure sshd to use post-quantum key exchange algorithms
  become: true
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?KexAlgorithms'
    line: 'KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group-exchange-sha256'
    state: present
    validate: 'sshd -t -f %s'
  notify: restart sshd

- name: Ensure sshd is enabled and running
  become: true
  systemd:
    name: sshd
    enabled: yes
    state: started
