---
- name: Install Zoom dependencies
  become: true
  dnf:
    name: 
      - glibc
      - glib2
      - libX11
      - libXfixes
      - libGL
      - sqlite
      - libXrender
      - libXcomposite
      - libxslt
      - pulseaudio-libs
      - alsa-lib
      - gstreamer1-plugins-base
      - mesa-dri-drivers
      - libxkbcommon-x11
      - xcb-util-keysyms
      - xcb-util-image
      - xcb-util-renderutil
      - xcb-util-wm
    state: present
  tags: [system]

- name: Check if Zoom is already installed
  command: rpm -q zoom
  register: zoom_installed
  changed_when: false
  failed_when: false
  tags: [apps, quick]

- name: Import Zoom GPG signing key
  become: true
  rpm_key:
    state: present
    key: https://zoom.us/linux/download/pubkey?version=5-12-6
  when: zoom_installed.rc != 0
  tags: [apps]

- name: Download Zoom RPM package
  become: true
  get_url:
    url: https://zoom.us/client/latest/zoom_x86_64.rpm
    dest: /tmp/zoom_x86_64.rpm
    mode: '0644'
  when: zoom_installed.rc != 0
  tags: [apps]

- name: Install Zoom from RPM
  become: true
  dnf:
    name: /tmp/zoom_x86_64.rpm
    state: present
    disable_gpg_check: yes
  when: zoom_installed.rc != 0
  tags: [apps]

- name: Clean up downloaded RPM
  become: true
  file:
    path: /tmp/zoom_x86_64.rpm
    state: absent
  when: zoom_installed.rc != 0
  tags: [apps]
